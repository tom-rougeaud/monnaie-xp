/* Projet : Monnaie XP  ·  Version : 2.1.0  ·  Date : 19/11/2026  |  Auteur : Tom Rougeaud  ·  Licence : CC BY-NC 4.0  |  Réalisé avec l’aide de l’IA : Claude Sonnet 5.5 (Anthropic) */
/* ===== SECTION : Variables ===== */
:root{
  --bg:#fbf6ec;        /* blanc cassé */
  --bg2:#fffdf8;       /* panneau clair */
  --bg3:#f3e8d4;       /* beige */
  --line:#d9c6a5;      /* contours sable */
  --txt:#3a2e22;       /* brun foncé (contraste > 10:1 sur --bg) */
  --txt2:#6b5a47;      /* brun moyen (contraste > 5:1) */
  --accent:#b4532a;    /* terracotta (texte blanc dessus : 5,5:1) */
  --accent2:#2d7f86;   /* bleu canard adouci */
  --gold:#8a5a00;      /* XP : ocre foncé lisible sur clair */
  --ok:#2f7d4f;        /* réussite (toujours accompagnée d’une icône) */
  --err:#b3402f;       /* erreur (toujours accompagnée d’une icône) */
  --mm:1.4;            /* pixels d’écran par millimètre réel (calculé en JS) */
  --fs:1;              /* échelle du texte (réglage) */
  --r:16px;            /* arrondi */
  --shadow:0 2px 8px rgba(90,60,20,.12);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
html.hc{--bg:#fff;--bg2:#fff;--bg3:#efe3cc;--line:#6b5a47;--txt:#000;--txt2:#2a2016;}

/* ===== SECTION : Mise en page générale ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:calc(16px*var(--fs));
  overscroll-behavior:none;}
body{touch-action:manipulation;}
#app{height:100dvh;display:flex;flex-direction:column;
  padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);max-width:1280px;margin:0 auto;}
#main{flex:1;min-height:0;display:flex;flex-direction:column;}
button{font:inherit;color:inherit;cursor:pointer;}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}
h1,h2,h3{margin:0;}

/* ===== SECTION : Barre du haut ===== */
#top{display:flex;align-items:center;gap:8px;padding:6px 10px;background:linear-gradient(#fffdf8,#f6ead2);border-bottom:2px solid var(--line);min-height:52px;}
#top .logo{height:26px;width:auto;display:block;flex:0 0 auto;background:#16273f;padding:4px 10px;border-radius:12px;box-sizing:content-box;}
#top .sp{flex:1;}
.xpbox{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 140px;max-width:260px;}
.xpbox .nm{font-size:.78rem;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar{height:10px;border-radius:6px;background:var(--bg3);border:1px solid var(--line);overflow:hidden;}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#e3a53a,#c8643b);width:0;transition:width .4s;}
.ibtn{flex:0 0 auto;min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg3);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-size:1rem;}
.ibtn:hover{background:var(--line);}
.btn{min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg3);font-weight:600;}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok);}
.btn.warn{background:var(--err);color:#fff;border-color:var(--err);}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

/* ===== SECTION : Écrans ===== */
.screen{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px;gap:10px;overflow:auto;}
.home-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{min-height:44px;padding:6px 12px;border-radius:22px;border:1px solid var(--line);background:var(--bg2);font-size:.9rem;}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.mode{background:var(--bg2);border:1px solid var(--line);border-top:6px solid var(--mc,var(--line));box-shadow:var(--shadow);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:112px;}
.mode:hover{background:var(--bg3);}
.mode .ic{font-size:1.9rem;line-height:1;}
.mode .t{font-weight:700;}
.mode .d{font-size:.8rem;color:var(--txt2);}
.mode .b{font-size:.72rem;color:var(--gold);margin-top:auto;}
.foot{display:flex;flex-wrap:wrap;gap:8px;}

/* ===== SECTION : Jeu ===== */
#game{flex:1;min-height:0;display:flex;flex-direction:column;}
.ghead{display:flex;align-items:center;gap:6px;padding:6px 10px;flex-wrap:wrap;}
.ghead .gt{font-weight:700;margin-right:auto;}
.schip{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:.85rem;white-space:nowrap;}
.ghead .ibtn{min-width:40px;padding:0 6px;}
.gbody{flex:1;min-height:0;display:grid;gap:6px;padding:0 10px 8px;grid-template-rows:auto auto auto 1fr auto;}
.prompt{box-shadow:var(--shadow);background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:space-between;}
.prompt .big{font-size:1.5rem;font-weight:800;color:var(--gold);}
.prompt .sm{font-size:.9rem;color:var(--txt2);}
.given{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.given img{width:calc(var(--mm)*var(--w)*.6px);height:auto;display:block;}
.msg{min-height:1.4em;font-size:.95rem;font-weight:600;}
.msg.ok{color:var(--ok);} .msg.err{color:var(--err);}
.pilebox{min-height:48px;max-height:24dvh;overflow:auto;background:var(--bg2);border:1px dashed var(--line);border-radius:var(--r);padding:6px 8px;display:flex;align-items:center;gap:10px;min-height:56px;}
.pilebox .tot{font-size:1.35rem;font-weight:800;min-width:92px;text-align:right;margin-left:auto;}
.pile{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1;}
.pitem{position:relative;min-width:44px;min-height:44px;padding:2px;background:transparent;border:1px solid var(--line);border-radius:10px;display:inline-flex;align-items:center;justify-content:center;}
.pitem img{width:calc(var(--mm)*var(--w)*.5px);height:auto;display:block;}
.pitem .n{position:absolute;right:-4px;top:-8px;background:#f2c85b;color:#3a2a00;font-size:.72rem;font-weight:800;border-radius:9px;padding:0 5px;}
.tray{box-shadow:var(--shadow);contain:size;min-height:0;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:6px;display:flex;flex-direction:column;gap:6px;align-content:flex-start;}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;}
.den{position:relative;min-width:44px;min-height:44px;padding:2px;background:transparent;border:1px solid transparent;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;}
.den:hover{border-color:var(--accent);}
.den img{width:calc(var(--mm)*var(--w)*1px);height:auto;display:block;pointer-events:none;-webkit-user-drag:none;}
.den .k{position:absolute;left:0;top:0;font-size:.62rem;background:var(--bg);color:var(--txt2);border-radius:5px;padding:0 4px;}
.den .st{position:absolute;right:0;bottom:0;font-size:.62rem;background:var(--bg);color:var(--gold);border:1px solid var(--line);border-radius:8px;padding:0 5px;font-weight:700;}
.den[disabled]{opacity:.3;cursor:not-allowed;}
@media (hover:none){.den .k{display:none;}}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.acts .btn{flex:1 1 120px;}

/* Grande largeur : plateau à droite */
@media (min-width:900px) and (min-height:520px),(min-width:600px) and (max-height:520px){
  .gbody{grid-template-columns:minmax(300px,2fr) 3fr;grid-template-rows:auto auto auto 1fr auto;}
  .gbody{align-items:start;}
  .gbody>.tray{grid-column:2;grid-row:1/6;align-self:stretch;}
  .gbody>.acts{align-self:end;}
  .gbody>.prompt,.gbody>.msg,.gbody>.pilebox,.gbody>.kpbox,.gbody>.acts{grid-column:1;}
  .gbody>.pilebox{align-self:start;min-height:120px;}
}

/* ===== SECTION : Pavé numérique ===== */
.kp{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-width:420px;width:100%;margin:0 auto;}
.kp button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg3);font-size:1.25rem;font-weight:700;}
.disp{font-size:1.6rem;font-weight:800;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:2px 6px;min-height:46px;margin-bottom:5px;max-width:420px;margin-left:auto;margin-right:auto;}

/* ===== SECTION : Tapis roulant ===== */
.belt{position:relative;height:calc(var(--mm)*40px);min-height:90px;overflow:hidden;background:linear-gradient(#e9d8b8,#d9c29a);border:1px solid var(--line);border-radius:var(--r);}
.belt img{position:absolute;top:50%;height:auto;width:calc(var(--mm)*var(--w)*1px);will-change:transform;}

/* ===== SECTION : Fenêtres, notifications ===== */
dialog{background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:16px;padding:0;max-width:min(94vw,640px);width:100%;max-height:92dvh;}
dialog::backdrop{background:rgba(58,46,34,.55);}
.dlg{display:flex;flex-direction:column;max-height:90dvh;}
.dlg h2{padding:14px 16px 6px;font-size:1.2rem;}
.dlg .bd{padding:6px 16px 10px;overflow:auto;display:flex;flex-direction:column;gap:10px;line-height:1.45;}
.dlg .ft{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px 14px;justify-content:flex-end;border-top:1px solid var(--line);}
.dlg p{margin:0;}
.dlg ul,.dlg ol{margin:0;padding-left:1.2em;}
.dlg input[type=text],.dlg input[type=password],.dlg input[type=number],.dlg textarea,.dlg select{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);padding:8px;font:inherit;}
.dlg label{font-size:.9rem;color:var(--txt2);display:block;margin-bottom:2px;}
#toast{position:fixed;left:50%;top:calc(58px + var(--safe-t));transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;}
#toast div{background:var(--bg2);color:var(--txt);border:2px solid var(--accent);border-radius:12px;padding:8px 14px;max-width:92vw;font-weight:600;box-shadow:0 4px 18px rgba(90,60,20,.3);}

/* ===== SECTION : Badges, scores ===== */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.bcard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:2px;font-size:.82rem;}
.bcard.on{border-color:var(--gold);}
.bcard.off{opacity:.65;}
.bcard .bi{font-size:1.5rem;}
.bcard .bn{font-weight:700;}
.bcard .bd2{color:var(--txt2);}
.bcard .pr{height:6px;border-radius:4px;background:var(--bg2);overflow:hidden;margin-top:2px;}
.bcard .pr>i{display:block;height:100%;background:var(--accent);}
.cat{font-weight:700;color:var(--gold);margin-top:6px;}
.stat{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:.9rem;}
.stat .bar{height:12px;}
.qr{background:#fff;padding:10px;border-radius:10px;align-self:center;line-height:0;}
.qr canvas{width:min(80vw,360px);height:auto;image-rendering:pixelated;}
.rec{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.rec .nm{font-weight:700;margin-right:auto;}
.trow{display:flex;gap:6px;align-items:center;margin-bottom:4px;flex-wrap:wrap;}
.trow>*{flex:1 1 90px;}
.trow .em{flex:0 0 56px;text-align:center;}
.trow .pr{flex:0 0 90px;}
.trow img{width:44px;height:44px;object-fit:cover;border-radius:8px;flex:0 0 44px;}

/* Téléphone en paysage : on libère la hauteur */
@media (max-height:520px){#app.ingame #top{display:none;} .prompt .big{font-size:1.15rem;} .prompt{padding:4px 8px;} .ghead{padding:2px 8px;} .gbody{gap:4px;padding-bottom:4px;} .msg{min-height:1.1em;font-size:.85rem;} .pilebox{min-height:48px;}}
/* ===== SECTION : Accessibilité ===== */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
@media (max-width:420px){.ghead{gap:4px;padding:4px 6px;} .ghead .tx{display:none;} #top{gap:6px;padding:6px;} #top .logo{height:20px;} .ibtn{min-width:44px;padding:0 4px;}}

</style>
</head>

var MEM={};

  /* lit une clé : navigateur si possible, sinon mémoire */
  get:function(k){try{var v=localStorage.getItem(k);if(v!==null)return v;}catch(e){}return MEM[k]===undefined?null:MEM[k];},
  /* écrit une clé ; renvoie true, "quota" (stockage plein) ou false (indisponible) */
  set:function(k,v){MEM[k]=v;try{localStorage.setItem(k,v);return true;}catch(e){return (e&&(e.name==="QuotaExceededError"||e.code===22))?"quota":false;}},
  del:function(k){delete MEM[k];try{localStorage.removeItem(k);}catch(e){}}
};

/* ===== SECTION : Utilitaires ===== */
/* crée un élément DOM sans innerHTML (sécurité) : h("div",{class:"x",text:"..."},enfants) */
function h(tag,p){
  var e=document.createElement(tag);p=p||{};
  for(var k in p){var v=p[k];
    if(k==="class")e.className=v;
    else if(k==="text")e.textContent=v;
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);
    else if(k==="style"&&typeof v==="object"){for(var s in v)e.style.setProperty(s,v[s]);}
    else if(v!==false&&v!==null&&v!==undefined)e.setAttribute(k,v);}
  for(var i=2;i<arguments.length;i++)add(e,arguments[i]);
  return e;
}
function add(e,c){
  if(c===null||c===undefined||c===false)return;
  if(Array.isArray(c)){c.forEach(function(x){add(e,x);});return;}
  e.appendChild(typeof c==="object"?c:document.createTextNode(String(c)));
}
function $(id){return document.getElementById(id);}
function clear(e){while(e.firstChild)e.removeChild(e.firstChild);}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}   /* entier aléatoire [a,b] */
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
/* montant en centimes -> « 3,20 € » (espace insécable) */
function fmt(c){return (c/100).toFixed(2).replace(".",",")+"\u00a0€";}
function pad(n){return n<10?"0"+n:""+n;}
function ymd(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
/* empreinte simple (cyrb53) : suffit pour ne pas exposer un mot de passe en clair, pas pour un vrai secret */
function cyrb53(str){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
function denById(id){for(var i=0;i<DEN.length;i++)if(DEN[i].id===id)return DEN[i];return null;}
/* étiquette de la touche clavier d’une coupure (selon la disposition du clavier si connue) */
var KEYLAB={};
function keyLabel(d){return d.key.indexOf("Digit")===0?d.key.slice(5):(KEYLAB[d.key]||d.key.slice(3));}
function denName(d){return (d.k==="coin"?"Pièce de ":"Billet de ")+d.lab;}

/* ===== SECTION : Logique de l’argent ===== */
/* décomposition minimale (l’algorithme glouton est optimal avec les coupures de l’euro) */
function minPieces(c){var o={},r=c;for(var i=DEN.length-1;i>=0;i--){var n=Math.floor(r/DEN[i].v);if(n){o[DEN[i].id]=n;r-=n*DEN[i].v;}}return o;}
function cnt(o){var n=0;for(var k in o)n+=o[k];return n;}
function sumOf(o){var s=0;for(var k in o){var d=denById(k);if(d)s+=d.v*o[k];}return s;}
/* forme « amount » avec un stock limité : renvoie la pile {id:n} ou null (recherche avec élagage) */
function solve(amount,stock){
  function go(i,rem,acc){
    if(rem===0)return acc;if(i<0)return null;
    var v=DEN[i].v,have=stock[DEN[i].id]||0,mx=Math.min(have,Math.floor(rem/v));
    for(var n=mx;n>=0;n--){var a2=Object.assign({},acc);if(n)a2[DEN[i].id]=n;var r=go(i-1,rem-n*v,a2);if(r)return r;}
    return null;}
  return go(DEN.length-1,amount,{});
}

var quotaWarned=false;

function saveCfg(){store.set(KEY_CFG,JSON.stringify(CFG));}

/* borne un nombre venant d’un fichier ou du stockage */
function num(x,max){x=Number(x);if(!isFinite(x)||x<0)return 0;return Math.min(Math.floor(x),max||MAX_STATE);}
function maskOf(x,bits){x=num(x,(1<<bits)-1);return x;}
function cleanStr(s,n){return String(s===undefined||s===null?"":s).replace(/[\u0000-\u001f<>]/g,"").trim().slice(0,n);}

/* valide et nettoie un état (stockage, import JSON v4, ancienne sauvegarde v3) ; renvoie un état propre */
function sanitizeState(d){
  if(!d||typeof d!=="object")throw new Error("Fichier illisible.");

  if(d.pm&&typeof d.pm==="object")for(i=1;i<=8;i++)s.pm[i]=num(d.pm[i],100000);

/* ===== SECTION : Badges (151) ===== */
var DAYS=["day_sun","day_mon","day_tue","day_wed","day_thu","day_fri","day_sat"];
var MONTHS=["mois_jan","mois_feb","mois_mar","mois_apr","mois_may","mois_jun","mois_jul","mois_aug","mois_sep","mois_oct","mois_nov","mois_dec"];
var TIMES={time_2m:2,time_5m:5,time_10m:10,time_30m:30,time_1h:60,time_2h:120,time_5h:300,time_10h:600};  /* minutes */
var EVENT_IDS=["hacker","j1_parfait","j2_parfait","j2_optimal","j3_parfait","j3_premier","j4_parfait","j4_rapide","j5_elite","j5_combo5","j6_parfait","j7_20","j7_15","j8_parfait","j8_recette",
  "lucky7","exact_1e","archeologue","apres_cours","matin_cours","weekend","debut_semaine","noel","saint_val","fete_nat","3modes_1j","bienvenue"];
function nbBadges(){return Object.keys(ST.badges).length;}
function has(id){return !!ST.badges[id];}
/* mesure d’un badge cumulatif : [valeur actuelle, objectif] ou null si badge d’événement */
function metric(id){
  var m;
  if((m=/^xp_(\d+)$/.exec(id)))return [ST.xp,+m[1]];
  if((m=/^g_(\d+)$/.exec(id)))return [ST.games,+m[1]];
  if((m=/^m(\d+)$/.exec(id)))return [ST.manches,+m[1]];
  if((m=/^rnd(\d+)$/.exec(id)))return [ST.rendues,+m[1]];
  if((m=/^amt_(\d+)e$/.exec(id)))return [Math.floor(ST.amount/100),+m[1]];
  if((m=/^j(\d)_x(\d+)$/.exec(id)))return [ST.pm[m[1]]||0,+m[2]];
  if((m=/^combo(\d+)$/.exec(id)))return [ST.comboBest,+m[1]];
  if((m=/^spd_(\d+)$/.exec(id)))return [(ST.bestSpeed>0&&ST.bestSpeed<+m[1]*1000)?1:0,1];
  if((m=/^streak_(\d+)$/.exec(id)))return [ST.streak,+m[1]];
  if((m=/^r_(\d+)$/.exec(id)))return [ST.restos,+m[1]];
  if((m=/^bdg_(\d+)$/.exec(id))){var t=+m[1];return [t===151?nbBadges()-(has(id)?1:0):nbBadges(),t===151?150:t];}
  if(TIMES[id])return [Math.floor(ST.playMs/60000),TIMES[id]];
  var di=DAYS.indexOf(id);if(di>=0)return [(ST.days>>di)&1,1];
  var mi=MONTHS.indexOf(id);if(mi>=0)return [(ST.months>>mi)&1,1];
  switch(id){
    case "all7days":return [bitCount(ST.days),7];
    case "all12mois":return [bitCount(ST.months),12];
    case "premiere_v":return [ST.games,1];
    case "restaurateur":return [ST.restos,1];
    case "explorateur":return [bitCount(ST.modesMask),8];
    case "goat":return [ST.xp,10000];
    case "collecte":return [bitCount(ST.den),13];
    case "allModes_parfait":return [bitCount(ST.perfMask),8];
    case "5parfaits":return [ST.perfectStreak,5];
    case "j8_x50plats":return [ST.plats,50];
    case "j8_x100plats":return [ST.plats,100];
    case "j8_x200plats":return [ST.plats,200];
    case "j8_x50client":return [ST.clients,50];
    case "r_photo":return [ST.photosMax,3];
    case "r_4cats":return [ST.cats4>0?1:0,1];
  }
  return null;
}
function bitCount(x){var n=0;while(x){n+=x&1;x>>=1;}return n;}
/* attribue un badge d’événement ou cumulatif ; renvoie true si nouveau */
var badgeQueue=[],recent=[];   /* recent : badges gagnés pendant la partie en cours */
function award(id){
  if(!BMAP[id]||has(id))return false;
  ST.badges[id]=ymd();badgeQueue.push(id);recent.push(id);return true;
}
/* parcourt tous les badges cumulatifs (plusieurs passes : les badges de comptage dépendent des autres) */
function checkBadges(){
  var changed=true,guard=0;
  while(changed&&guard++<5){changed=false;
    BADGES.forEach(function(b){if(has(b.id))return;var m=metric(b.id);if(m&&m[0]>=m[1]){if(award(b.id))changed=true;}});}
  flushBadges();
}
/* affiche les nouveaux badges un par un */
function flushBadges(){
  if(!badgeQueue.length)return;
  var ids=badgeQueue.splice(0);saveST();
  ids.slice(0,3).forEach(function(id,i){setTimeout(function(){toast(BMAP[id].icon+" Badge : "+BMAP[id].name);playTone("badge");},i*900);});
  if(ids.length>3)setTimeout(function(){toast("🏅 +"+(ids.length-3)+" autres badges !");},2700);
}

var AC=null;

function playTone(kind){
  if(CFG.mute)return;

    if(!AC){if(navigator.userActivation&&!navigator.userActivation.hasBeenActive)return;   /* pas de son avant un geste */
      var C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();}

    seq.forEach(function(n){var o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=n[0];g.gain.value=.06; /* volume modéré */
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+n[1]);t+=n[1];});
  }catch(e){}
}
var openDlg=null;
/* ouvre une fenêtre accessible (<dialog> modal : focus piégé, Échap) ; btns = [{t,cls,fn}] ; fn renvoie false pour garder ouverte */
function dialog(title,body,btns,opts){

    if(i===(opts.focus||0))first=bt;ft.appendChild(bt);});

/* ===== SECTION : Adaptation de la taille des coupures (échelle réelle) ===== */
/* cherche la plus grande échelle (px/mm) qui fait tenir le plateau sans défilement, puis applique le zoom du joueur */
function fitTray(tray){
  if(!tray||!tray.clientHeight)return;
  var root=document.documentElement,lo=0.5,hi=3.2;
  for(var i=0;i<9;i++){var mid=(lo+hi)/2;root.style.setProperty("--mm",mid);
    if(tray.scrollHeight<=tray.clientHeight+1&&tray.scrollWidth<=tray.clientWidth+1)lo=mid;else hi=mid;}
  root.style.setProperty("--mm",lo.toFixed(3));
  /* sécurité : la mise en page peut varier légèrement, on réduit tant que ça déborde */
  for(var k=0;k<14&&(tray.scrollHeight>tray.clientHeight+1||tray.scrollWidth>tray.clientWidth+1);k++){lo*=0.95;root.style.setProperty("--mm",lo.toFixed(3));}
  root.style.setProperty("--mm",(lo*CFG.zoom).toFixed(3));
}
var fitTarget=null;
function refit(){if(fitTarget&&fitTarget.isConnected)fitTarget.__fit?fitTarget.__fit():fitTray(fitTarget);}

/* ===== SECTION : Composant « caisse » (plateau de coupures + pile) ===== */
/* opts : stock (objet ou null), showTotal (bool), onChange */
function makeCaisse(opts){
  var C={pile:{},stock:opts.stock||null,btns:{},locked:false};
  var tot=h("div",{class:"tot","aria-live":"off"});
  var pileEl=h("div",{class:"pile","aria-label":"Ta pile de coupures"});
  var pilebox=h("div",{class:"pilebox"},pileEl,tot);
  var tray=h("div",{class:"tray",role:"group","aria-label":"Coupures disponibles"});
  var rowC=h("div",{class:"row"}),rowB=h("div",{class:"row"});
  DEN.forEach(function(d){
    var b=h("button",{class:"den",type:"button","aria-label":denName(d)+" : ajouter",onclick:function(){C.add(d.id);}},denImg(d));
    b.appendChild(h("span",{class:"k",text:keyLabel(d)}));
    if(C.stock){b.appendChild(h("span",{class:"st"}));}
    C.btns[d.id]=b;(d.k==="coin"?rowC:rowB).appendChild(b);
  });
  tray.appendChild(rowC);tray.appendChild(rowB);
  /* met à jour l’affichage (pile, total, stocks) */
  C.render=function(){
    clear(pileEl);
    DEN.forEach(function(d){var n=C.pile[d.id];if(!n)return;
      var it=h("button",{class:"pitem",type:"button","aria-label":"Retirer : "+denName(d)+" (×"+n+")",onclick:function(){C.remove(d.id);}},denImg(d,""));
      if(n>1)it.appendChild(h("span",{class:"n",text:"×"+n}));pileEl.appendChild(it);});
    if(!cnt(C.pile))pileEl.appendChild(h("span",{class:"sm",text:"Touche une coupure pour l’ajouter.",style:{color:"var(--txt2)"}}));
    tot.textContent=opts.showTotal?fmt(sumOf(C.pile)):"? €";
    DEN.forEach(function(d){var b=C.btns[d.id];if(C.stock){var left=(C.stock[d.id]||0)-(C.pile[d.id]||0);b.querySelector(".st").textContent="×"+left;b.disabled=left<=0||C.locked;}else b.disabled=C.locked;});
    if(opts.onChange)opts.onChange(C);
  };
  C.add=function(id){if(C.locked)return;if(C.stock&&(C.pile[id]||0)>=(C.stock[id]||0))return;if(cnt(C.pile)>=60)return;C.pile[id]=(C.pile[id]||0)+1;playTone("ok");C.render();};
  C.remove=function(id){if(C.locked||!C.pile[id])return;C.pile[id]--;if(!C.pile[id])delete C.pile[id];C.render();};
  C.removeLast=function(){if(C.locked)return;for(var i=DEN.length-1;i>=0;i--)if(C.pile[DEN[i].id]){C.remove(DEN[i].id);return;}};
  C.clear=function(){if(C.locked)return;C.pile={};C.render();};
  C.total=function(){return sumOf(C.pile);};
  C.setPile=function(p){C.pile=Object.assign({},p);C.render();};
  C.nodes={pilebox:pilebox,tray:tray};
  C.tray=tray;
  tray.__fit=function(){fitTray(tray);};
  C.render();
  return C;
}

/* prix selon le niveau : 1 = ronds (≤ 15 €), 2 = au 5 c près (≤ 45 €), 3 = au centime (≤ 90 €) */
function genPrice(level){
  var k=level===1?1:(level===2?rnd(1,2):rnd(2,4)),max=level===1?1500:(level===2?4500:9000),p=0,d=[],tries=0;
  do{p=0;d=[];for(var i=0;i<k;i++){var s=pick(SCEN);p+=s.prix;d.push(s.desc);}}while(p>max&&++tries<40);
  if(p>max){p=pick(SCEN).prix;d=["Achat"];}
  if(level===1)p=Math.max(10,Math.round(p/10)*10);
  if(level===3)p+=rnd(0,9);
  return {price:p,desc:d.length>1?d[0]+" et "+(d.length-1===1?d[1]:(d.length-1)+" autres articles"):d[0]};
}
/* ce que donne le client : un billet, deux billets, ou un billet + des pièces (selon le niveau) */
function givenFor(price,level){
  var bills=[500,1000,2000,5000,10000],opts=[],i,j;
  var single=bills.filter(function(b){return b>price;});
  if(single.length){opts.push([single[0]]);if(single[1])opts.push([single[1]]);}
  if(level>=2){for(i=0;i<4;i++)for(j=i;j<4;j++){var s=bills[i]+bills[j];if(s>price&&s-price<=3000&&bills[i]<price)opts.push([bills[i],bills[j]]);}}
  var res=[];
  opts.forEach(function(o){var p={};o.forEach(function(b){var d=DEN.filter(function(x){return x.v===b;})[0];p[d.id]=(p[d.id]||0)+1;});res.push(p);});
  if(level>=2){
    var base=bills.filter(function(b){return b<price;}).pop();
    if(base){var rem=price-base,step=pick([10,50,100]),extra=Math.ceil(rem/step)*step;
      if(extra>0&&base+extra>price){var p2={};DEN.forEach(function(d){if(d.v===base&&d.k==="bill")p2[d.id]=1;});var mp=minPieces(extra);for(var k in mp)p2[k]=(p2[k]||0)+mp[k];res.push(p2);if(level===3){res.push(p2);}}}
  }
  var g=pick(res);return {pieces:g,sum:sumOf(g)};
}
/* rendu à calculer (modes 4, 5, 7) ; avec une petite chance de 1,00 € ou 7,77 € pour rendre ces badges atteignables */
function genChange(level,stock){
  for(var t=0;t<60;t++){
    var q,r=Math.random();
    if(r<.06){var b=pick([500,1000,2000]);q={desc:"Achat",price:b-100};}
    else if(r<.09&&level>=2){q={desc:"Achat",price:1000-777};}
    else q=genPrice(level);
    var g=givenFor(q.price,level),change=g.sum-q.price;
    if(change<=0||change>9999)continue;
    if(stock&&!solve(change,stock))continue;
    return {kind:"change",desc:q.desc,price:q.price,given:g.pieces,target:change};
  }
  return null;
}
/* montant à composer (modes 2 et 3) */
function genTarget(level,minimum){
  for(var t=0;t<60;t++){
    var v=level===1?rnd(5,100)*10:(level===2?rnd(20,1000)*5:rnd(500,20000));
    if(minimum&&cnt(minPieces(v))<3)continue;return v;}
  return 1285;
}
/* ensemble de coupures à additionner (modes 1 et 6) */
function genPieces(level,count){
  var pool=level===1?["c10","c20","c50","e1","e2"]:(level===2?["c5","c10","c20","c50","e1","e2","b5","b10","b20"]:DEN.map(function(d){return d.id;}));
  var out=[];for(var i=0;i<count;i++)out.push(pick(pool));return out;
}
/* commande d’un client du restaurant : 2 à 5 plats selon le niveau */
function genOrder(carte,level){
  var all=[];CATS.forEach(function(c){(carte.items[c.id]||[]).forEach(function(it){all.push(it);});});
  var k=Math.min(all.length,level===1?rnd(2,3):(level===2?rnd(2,4):rnd(3,5)));
  var items=shuffle(all).slice(0,k).map(function(it){return {name:it.name,prix:it.prix,qty:(level===3&&Math.random()<.3)?2:1,imgB64:it.imgB64,emo:it.emo};});
  var total=0,qty=0;items.forEach(function(it){total+=it.prix*it.qty;qty+=it.qty;});
  var g=givenFor(total,level);
  return {kind:"order",items:items,price:total,qty:qty,given:g.pieces,target:g.sum-total};
}

/* passe à la question suivante, ou termine */
function nextQuestion(){
  if(!G||G.over)return;
  if(G.qi>=G.n){
    if(G.mode.id===8&&!G.recetteDone){G.recetteDone=true;G.qi=G.n+1;askRecette();return;}
    finishGame();return;}
  G.qi++;G.attempt=0;G.locked=false;G.awaiting=false;G.pauseAccum=0;G.qStart=performance.now();
  var md=G.mode,q;
  if(md.id===1||md.id===6){q={kind:"total",pieces:genPieces(G.level,md.id===6?(G.level===1?4:(G.level===2?6:8)):(G.level===1?4:(G.level===2?rnd(4,5):rnd(5,7))))};q.target=q.pieces.reduce(function(s,i){return s+denById(i).v;},0);}
  else if(md.id===2){q={kind:"target",target:genTarget(G.level,false)};}
  else if(md.id===3){q={kind:"target",target:genTarget(G.level,true),needOpt:true};}
  else if(md.id===4){q=genChange(G.level,G.stock);if(!q){G.stock=startStock(G.level);q=genChange(G.level,G.stock);}}
  else if(md.id===8){q=genOrder(G.carte,G.level);G.recette+=q.price;}
  else q=genChange(G.level,null);
  q.attempts=md.att;G.q=q;
  chips();
  if(q.kind==="total")renderTotal(q);else renderCompose(q);
}

function say(t,cls){var m=$("msg");if(m){m.textContent=t;m.className="msg "+(cls||"");}}
/* contrôle de la composition du joueur */
function validateCompose(){
  if(!G||G.locked||G.paused)return;
  var C=G.caisse,q=G.q,total=C.total();
  if(!cnt(C.pile)){say("Ajoute au moins une coupure.","err");return;}
  var sumOk=total===q.target,optimal=cnt(C.pile)===cnt(minPieces(q.target));
  if(sumOk&&(!q.needOpt||optimal)){endQuestion(G.attempt===0?1:.5,C.pile);return;}
  if(sumOk&&q.needOpt&&!optimal){ /* montant juste mais pas minimal */
    G.err++;G.attempt++;playTone("err");
    if(G.attempt>=q.attempts){endQuestion(.5,C.pile);return;}
    say("✗ Montant juste, mais tu peux faire avec moins de coupures.","err");return;}
  G.err++;G.attempt++;playTone("err");
  if(G.attempt>=q.attempts){endQuestion(0,null);return;}
  say(total<q.target?"✗ Il manque "+fmt(q.target-total)+".":"✗ Il y a "+fmt(total-q.target)+" de trop.","err");
}
/* fin d’une question : score 1 (du premier coup), 0,5 (second essai) ou 0 ; pile = coupures données */
function endQuestion(score,pile){
  if(!G||G.locked)return;G.locked=true;
  var now=performance.now(),dt=now-G.qStart-G.pauseAccum,q=G.q,md=G.mode.id;
  G.times.push(dt);G.pts+=score;ST.manches++;
  if(score>0)G.ok++;
  if(score===1){G.streak++;ST.combo++;if(G.streak>G.bestStreak)G.bestStreak=G.streak;if(ST.combo>ST.comboBest)ST.comboBest=ST.combo;
    if(dt>400&&(ST.bestSpeed===0||dt<ST.bestSpeed))ST.bestSpeed=Math.round(dt);}
  else{G.streak=0;ST.combo=0;}
  if(score<1&&md===8)G.allPerfectOrders=false;
  var solution=null;
  if(score===0)solution=md===4?solve(q.target,G.stock):minPieces(q.target);
  if(score>0&&pile){ /* compteurs de coupures et de montants (comptés seulement sur une réponse juste) */
    ST.rendues+=cnt(pile);ST.amount+=q.target;
    DEN.forEach(function(d,i){if(pile[d.id])ST.den|=1<<i;});
    if(pile.c1)award("archeologue");
    if(q.target===777)award("lucky7");
    if(q.target===100)award("exact_1e");
    if(md===2&&cnt(pile)===cnt(minPieces(q.target)))award("j2_optimal");
  }
  if(score>0&&md===3)award("j3_premier");
  if(score>0&&md===4&&dt<5000)award("j4_rapide");
  if(md===5&&G.streak>=5)award("j5_combo5");
  if(md===4){ /* le tiroir évolue : on encaisse ce qu’a donné le client, on retire le rendu */
    if(pile)for(var k in pile)G.stock[k]=Math.max(0,(G.stock[k]||0)-pile[k]);
    for(var g in q.given)G.stock[g]=(G.stock[g]||0)+q.given[g];}
  if(md===8){ST.clients++;ST.plats+=q.qty;}
  if(score===0){ /* correction expliquée */
    if(G.caisse){G.caisse.locked=true;if(solution)G.caisse.setPile(solution);}
    say("✗ Correction : "+fmt(q.target)+(q.kind==="target"?"":" à rendre")+" (voici une solution).","err");
  }else say(score===1?"✓ Bravo !":"✓ Juste, au second essai.","ok");
  playTone(score>0?"ok":"err");
  if(G.caisse)G.caisse.locked=true;
  checkBadges();saveST();chips();renderTop();
  var acts=$("acts");
  if(acts){clear(acts);
    if(score<1&&md!==5){
      acts.appendChild(h("button",{class:"btn pri",type:"button",id:"bNext",text:"Continuer ▶",onclick:nextQuestion}));G.awaiting=true;
      var bn=$("bNext");if(bn)bn.focus();
    }else setTimeout(function(){if(G&&!G.over&&G.q===q)nextQuestion();},md===5?(score<1?1600:500):900);}
  else setTimeout(nextQuestion,900);
}

function validateTotal(c){
  if(!G||G.locked||G.paused||G.awaitingBelt)return;
  var q=G.q;
  if(c===q.target){endTotal(G.attempt===0?(G.sawClear?.75:1):.5);return;}
  G.err++;G.attempt++;playTone("err");
  if(G.attempt>=q.attempts){endTotal(0);return;}
  say(c<q.target?"✗ C’est plus que "+fmt(c)+".":"✗ C’est moins que "+fmt(c)+".","err");G.kp.reset();
}
function endTotal(score){
  G.locked=true;var q=G.q,dt=performance.now()-G.qStart-G.pauseAccum;
  G.times.push(dt);G.pts+=score;ST.manches++;if(score>0)G.ok++;
  if(score===1){G.streak++;ST.combo++;if(G.streak>G.bestStreak)G.bestStreak=G.streak;if(ST.combo>ST.comboBest)ST.comboBest=ST.combo;}else{G.streak=0;ST.combo=0;}
  G.kp.lock(true);
  say(score>0?(score===1?"✓ Bravo !":"✓ Juste."):"✗ Correction : "+fmt(q.target)+".",score>0?"ok":"err");

/* calcule l’XP : 60 % réussite + 20 % rapidité + 20 % série, plafonnée par le niveau (jamais plus de 250) */
function computeXP(){
  var md=G.mode,acc=G.pts/G.n,avg=G.times.length?G.times.reduce(function(a,b){return a+b;},0)/G.times.length:md.tm[1];
  var speed=clamp((md.tm[1]-avg)/(md.tm[1]-md.tm[0]),0,1),combo=G.bestStreak/G.n;
  var mul=md.id===6?0.6+0.4*(G.speed-1)/9:1;
  var cap=CAP_XP[G.level],xp=Math.round(cap*(0.6*acc+0.2*speed+0.2*combo)*mul);
  if(G.pts>0&&xp<1)xp=1;
  return {xp:Math.min(250,Math.min(cap,xp)),acc:acc,avg:avg};
}

/* code compact (QR / copier-coller) : badges en bits, sans l’historique */

  function penalty(){
    var p=0,x,y,run,col;
    for(y=0;y<size;y++){run=1;for(x=1;x<size;x++){if(M[y][x]===M[y][x-1]){run++;if(run===5)p+=3;else if(run>5)p++;}else run=1;}}
    for(x=0;x<size;x++){run=1;for(y=1;y<size;y++){if(M[y][x]===M[y-1][x]){run++;if(run===5)p+=3;else if(run>5)p++;}else run=1;}}

  if(idx===null){CARTES.push(clean);ST.restos++;}else CARTES[idx]=clean;
  ST.photosMax=Math.max(ST.photosMax,photos);if(cats===4)ST.cats4++;
  saveCartes();checkBadges();saveST();toast("✓ Restaurant enregistré.");setTimeout(restoMenu,40);
}
/* export d’un restaurant : fichier .restaurant et QR (si assez court) */
function restoExport(i){
  var code="MXPRESTO:"+b64enc(JSON.stringify(CARTES[i]));
  var cv=code.length<=900?qrCanvas(code):null;
  var qrNote=cv?h("div",{class:"qr"},cv):h("p",{text:"Ce restaurant (avec ses photos) est trop volumineux pour un QR : utilise le fichier."});
  dialog("⬇ Exporter « "+CARTES[i].name+" »",[
    h("p",{text:"Envoie ce fichier à quelqu’un : il l’importera dans son appli. Pour le QR, scanne-le puis colle le texte dans « Importer »."}),
    h("div",{class:"acts"},h("button",{class:"btn pri",type:"button",text:"⬇ Télécharger le fichier",onclick:function(){
        if(download("restaurant_"+safeName(CARTES[i].name)+".restaurant",code))toast("Fichier téléchargé.");}}),
      h("button",{class:"btn",type:"button",text:"⧉ Copier le code",onclick:function(){copyText(code);}})),qrNote],[{t:"Retour",fn:function(){setTimeout(restoMenu,40);}}]);
}
function restoImport(){
  var ta=h("textarea",{rows:"4","aria-label":"Code restaurant",placeholder:"Colle ici un code MXPRESTO:…"});
  function apply(text){
    try{text=String(text||"").trim();if(text.indexOf("MXPRESTO:")!==0||text.length>3e6)throw 1;
      var c=sanitizeCarte(JSON.parse(b64dec(text.slice(9))));if(!c)throw 1;
      var base=c.name,k=2;while(CARTES.some(function(x){return x.name===c.name;}))c.name=cleanStr(base,25)+" ("+(k++)+")";
      CARTES.push(c);ST.restos++;saveCartes();checkBadges();saveST();toast("✓ Restaurant importé : "+c.name);return true;}
    catch(e){toast("✗ Ce fichier n’est pas un restaurant valide.");return false;}
  }
  dialog("⬆ Importer un restaurant",[
    h("button",{class:"btn",type:"button",text:"Choisir un fichier (.restaurant)",onclick:function(){pickFile(".restaurant,.txt,text/plain",function(t){if(apply(t)){closeDlg();setTimeout(restoMenu,40);}});}}),
    h("label",{},"ou colle un code :"),ta],[{t:"Annuler",fn:function(){setTimeout(restoMenu,40);}},{t:"Importer",cls:"pri",fn:function(){if(!apply(ta.value))return false;setTimeout(restoMenu,40);}}]);
}

/* ===== SECTION : Installation (PWA) ===== */
var deferredPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferredPrompt=e;});
window.addEventListener("appinstalled",function(){deferredPrompt=null;closeDlg();toast("✓ Appli installée !");});
function isStandalone(){try{return matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||navigator.standalone===true;}catch(e){return false;}}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);}
/* schéma SVG des 3 étapes sur iPhone / iPad (Safari) */
function iosSteps(){
  var NS="http://www.w3.org/2000/svg";
  function el(t,a,txt){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(txt)e.textContent=txt;return e;}
  var s=el("svg",{viewBox:"0 0 360 120",role:"img","aria-label":"Étapes : Partager, puis Sur l’écran d’accueil, puis Ajouter",width:"100%"});
  [[10,"1","Partager"],[130,"2","Sur l’écran d’accueil"],[250,"3","Ajouter"]].forEach(function(st,i){
    s.appendChild(el("rect",{x:st[0],y:10,width:100,height:100,rx:12,fill:"#1f3556",stroke:"#6cc4e8"}));
    s.appendChild(el("text",{x:st[0]+10,y:30,fill:"#e7c068","font-size":16,"font-weight":700},st[1]));
    s.appendChild(el("text",{x:st[0]+50,y:104,fill:"#eef3fa","font-size":10,"text-anchor":"middle"},st[2]));
    if(i===0){s.appendChild(el("rect",{x:st[0]+34,y:44,width:32,height:30,rx:4,fill:"none",stroke:"#eef3fa","stroke-width":3}));
      s.appendChild(el("path",{d:"M"+(st[0]+50)+" 58V26M"+(st[0]+40)+" 36l10-10 10 10",fill:"none",stroke:"#6cc4e8","stroke-width":3,"stroke-linecap":"round"}));}
    if(i===1){s.appendChild(el("rect",{x:st[0]+28,y:46,width:44,height:34,rx:6,fill:"none",stroke:"#eef3fa","stroke-width":3}));
      s.appendChild(el("path",{d:"M"+(st[0]+50)+" 54v18M"+(st[0]+41)+" 63h18",stroke:"#6cc4e8","stroke-width":3,"stroke-linecap":"round"}));}
    if(i===2){s.appendChild(el("rect",{x:st[0]+20,y:50,width:60,height:26,rx:13,fill:"#6cc4e8"}));
      s.appendChild(el("text",{x:st[0]+50,y:68,fill:"#06233a","font-size":13,"font-weight":700,"text-anchor":"middle"},"Ajouter"));}
  });
  return s;
}
/* fenêtre d’installation ; force = ouverte à la demande de la personne */
function installDialog(force){
  if(isStandalone()){if(force)toast("L’appli est déjà installée sur cet appareil.");return;}
  if(!force&&(CFG.install.never||Date.now()<CFG.install.later||G||openDlg))return;
  var body=[h("p",{text:"Installe Monnaie XP sur ton écran d’accueil : elle s’ouvre en plein écran et marche sans connexion. Rien n’est envoyé à un tiers."})];
  var btns=[];
  if(deferredPrompt){
    btns.push({t:"Installer l’appli",cls:"pri",fn:function(){var p=deferredPrompt;deferredPrompt=null;try{p.prompt();p.userChoice.then(function(c){if(c.outcome!=="accepted")toast("Installation annulée.");});}catch(e){}}});
  }else if(isIOS()){
    body.push(h("p",{text:"Sur iPhone ou iPad, l’installation se fait à la main, dans Safari :"}));body.push(iosSteps());
    body.push(h("ol",{},h("li",{text:"Touche le bouton Partager."}),h("li",{text:"Choisis « Sur l’écran d’accueil »."}),h("li",{text:"Touche « Ajouter »."})));
  }else{
    body.push(h("p",{text:"Ton navigateur ne propose pas l’installation directe. Ouvre son menu (⋮ ou ⋯) puis choisis « Installer l’appli » ou « Ajouter à l’écran d’accueil »."}));
  }
  if(!force){
    btns.push({t:"Plus tard",fn:function(){CFG.install.later=Date.now()+3*864e5;saveCfg();}});
    btns.push({t:"Ne plus proposer",fn:function(){CFG.install.never=1;saveCfg();}});
  }else btns.push({t:"Fermer"});
  dialog("📲 Installer l’appli",body,btns);
}
/* service worker : fonctionne hors ligne ; annonce une nouvelle version sans perdre les données */
function registerSW(){
  if(!("serviceWorker" in navigator)||!/^https?:$/.test(location.protocol))return;
  try{
    navigator.serviceWorker.register("./sw.js").then(function(reg){
      reg.addEventListener("updatefound",function(){
        var nw=reg.installing;if(!nw)return;
        nw.addEventListener("statechange",function(){
          if(nw.state==="installed"&&navigator.serviceWorker.controller&&!G){
            dialog("Nouvelle version disponible",[h("p",{text:"Une nouvelle version de Monnaie XP est prête. Tes données sont conservées."})],
              [{t:"Plus tard"},{t:"Mettre à jour",cls:"pri",fn:function(){nw.postMessage("skipWaiting");}}]);}});});
    }).catch(function(){});
    var reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",function(){if(reloaded)return;reloaded=true;location.reload();});
  }catch(e){}
}

/* ===== SECTION : Clavier et manette ===== */
document.addEventListener("keydown",function(e){
  var t=e.target&&e.target.tagName;if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT")return;
  if(openDlg||!G||G.over)return;
  var code=e.code,handled=true;
  if(G.paused){return;}
  if(code==="KeyP"||code==="Escape"){pauseGame();}
  else if(e.key==="+"||code==="NumpadAdd"){zoom(.1);}
  else if(e.key==="-"||code==="NumpadSubtract"){zoom(-.1);}
  else if(G.awaiting){if(code==="Enter"||code==="Space"){var b=$("bNext");if(b)b.click();}else handled=false;}
  else if(G.q&&G.q.kind==="total"||G.q&&G.q.kind==="recette"){
    if(!G.kp||G.locked||G.awaitingBelt){handled=false;}
    else if(/^(Digit|Numpad)\d$/.test(code)){G.kp.press(code.slice(-1));}
    else if(code==="Comma"||code==="Period"||code==="NumpadDecimal"||e.key===","||e.key==="."){G.kp.press(",");}
    else if(code==="Backspace"){G.kp.press("del");}
    else if(code==="Enter"||code==="NumpadEnter"){G.kp.press("ok");}
    else handled=false;
  }else if(G.caisse&&!G.locked){
    var den=null;DEN.forEach(function(d){if(d.key===code||("Numpad"+d.key.slice(5))===code&&d.key.indexOf("Digit")===0)den=d;});
    if(den)G.caisse.add(den.id);
    else if(code==="Backspace")G.caisse.removeLast();
    else if(code==="Delete")G.caisse.clear();
    else if(code==="Enter"||code==="NumpadEnter")validateCompose();
    else handled=false;
  }else handled=false;
  if(handled)e.preventDefault();
});
var gpPrev={};
/* manette : croix = se déplacer, A = choisir, B = retirer / fermer, Start = valider ou pause */
function gpLoop(){
  var pads=navigator.getGamepads?navigator.getGamepads():[],pad=null;
  for(var i=0;i<pads.length;i++)if(pads[i]){pad=pads[i];break;}
  if(pad){
    var cur={};pad.buttons.forEach(function(b,i){cur[i]=b.pressed;});
    function edge(i){return cur[i]&&!gpPrev[i];}
    if(edge(12)||edge(14))gpMove(-1);if(edge(13)||edge(15))gpMove(1);
    if(edge(0)&&document.activeElement&&document.activeElement.click)document.activeElement.click();
    if(edge(1)){if(openDlg)closeDlg();else if(G&&G.caisse)G.caisse.removeLast();}
    if(edge(9)){if(G&&!G.over&&!openDlg){if(G.caisse&&!G.locked&&!G.paused)validateCompose();else pauseGame();}}
    gpPrev=cur;}
  requestAnimationFrame(gpLoop);
}
/* déplace le focus dans la liste des boutons visibles */
function gpMove(d){
  var scope=openDlg?openDlg:document.body;
  var els=Array.prototype.filter.call(scope.querySelectorAll("button:not([disabled]),input,select,textarea"),function(x){return x.offsetParent!==null;});
  if(!els.length)return;var i=els.indexOf(document.activeElement);els[(i+d+els.length)%els.length].focus();
}
window.addEventListener("gamepadconnected",function(){toast("🎮 Manette détectée.");requestAnimationFrame(gpLoop);});

/* ===== SECTION : Gestion d’erreur globale ===== */
var errShown=0;
window.addEventListener("error",function(){
  if(errShown++>2)return;
  try{toast("Un problème est survenu, recommence.");if(G&&!G.over){clearInterval(G.sprintIv);G=null;renderHome();}}catch(e){}
});
window.addEventListener("unhandledrejection",function(){if(errShown++>2)return;try{toast("Un problème est survenu, recommence.");}catch(e){}});

/* ===== SECTION : Démarrage ===== */
function boot(){
  loadAll();applyPrefs();
  try{if(navigator.keyboard&&navigator.keyboard.getLayoutMap)navigator.keyboard.getLayoutMap().then(function(m){["KeyQ","KeyW","KeyE","KeyR","KeyT"].forEach(function(c){var k=m.get(c);if(k)KEYLAB[c]=k.toUpperCase();});});}catch(e){}
  var first=!ST.badges.bienvenue;award("bienvenue");checkBadges();saveST();
  renderHome();
  if(!ST.pseudo)askPseudo();
  registerSW();
  var interacted=false,t0=Date.now();
  ["pointerdown","keydown"].forEach(function(ev){document.addEventListener(ev,function(){interacted=true;},{once:true});});
  /* fenêtre d’installation : après un peu d’usage, jamais en partie, jamais à l’ouverture brute */
  var iv=setInterval(function(){
    if(interacted&&Date.now()-t0>25000&&view==="home"&&!openDlg&&!G){clearInterval(iv);installDialog(false);}},4000);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();

</script>
